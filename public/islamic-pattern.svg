<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <!-- Soft 3D drop shadow filter to give the carved relief look like the user image -->
    <filter id="relief-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="inner-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8faf9" />
      <stop offset="100%" stop-color="#f2f6f4" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f7f6" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="160" height="160" fill="url(#bgGrad)" />

  <!-- Recessed Star Centers -->
  <g fill="#e9f0ee" filter="url(#inner-depth)" opacity="0.9">
    <!-- Center 8-pointed star small -->
    <polygon points="80,68 83.5,76.5 92,80 83.5,83.5 80,92 76.5,83.5 68,80 76.5,76.5" />
    <!-- Corner 8-pointed stars small -->
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" />
    <polygon points="160,-12 163.5,-3.5 172,0 163.5,3.5 160,12 156.5,3.5 148,0 156.5,-3.5" />
    <polygon points="0,148 3.5,156.5 12,160 3.5,163.5 0,172 -3.5,163.5 -12,160 -3.5,156.5" />
    <polygon points="160,148 163.5,156.5 172,160 163.5,163.5 160,172 156.5,163.5 148,160 156.5,156.5" />
  </g>

  <!-- Geometric Interlaced Lattice (White Raised 3D Relief) -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" filter="url(#relief-shadow)">
    <!-- Central Octagram (8-pointed star) Outer Contour -->
    <polygon points="80,56 87,73 104,80 87,87 80,104 73,87 56,80 73,73" />
    <polygon points="80,56 97,63 104,80 97,97 80,104 63,97 56,80 63,63" />

    <!-- Corner Octagrams -->
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" />
    <polygon points="160,-24 167,-7 184,0 167,7 160,24 153,7 136,0 153,-7" />
    <polygon points="0,136 7,153 24,160 7,167 0,184 -7,167 -24,160 -7,153" />
    <polygon points="160,136 167,153 184,160 167,167 160,184 153,167 136,160 153,153" />

    <!-- 45-degree Connecting Squares -->
    <!-- Center connecting diamond squares -->
    <rect x="66" y="66" width="28" height="28" transform="rotate(45 80 80)" />
    
    <!-- Top-Mid, Bottom-Mid, Left-Mid, Right-Mid Cross Connectors -->
    <path d="M40,0 L40,40 L0,40" />
    <path d="M120,0 L120,40 L160,40" />
    <path d="M0,120 L40,120 L40,160" />
    <path d="M160,120 L120,120 L120,160" />

    <path d="M80,0 L100,20 L80,40 L60,20 Z" />
    <path d="M80,120 L100,140 L80,160 L60,140 Z" />
    <path d="M0,80 L20,60 L40,80 L20,100 Z" />
    <path d="M120,80 L140,60 L160,80 L140,100 Z" />

    <!-- Interlacing Star Ray Extensions -->
    <line x1="80" y1="0" x2="80" y2="56" />
    <line x1="80" y1="104" x2="80" y2="160" />
    <line x1="0" y1="80" x2="56" y2="80" />
    <line x1="104" y1="80" x2="160" y2="80" />

    <line x1="20" y1="20" x2="63" y2="63" />
    <line x1="140" y1="20" x2="97" y2="63" />
    <line x1="20" y1="140" x2="63" y2="97" />
    <line x1="140" y1="140" x2="97" y2="97" />

    <line x1="0" y1="0" x2="160" y2="160" stroke-opacity="0.1" />
    <line x1="160" y1="0" x2="0" y2="160" stroke-opacity="0.1" />
  </g>

  <!-- Crisp Top Bevel Highlights (Inner Subtle Lines) -->
  <g fill="none" stroke="#e0e8e5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="80,56 87,73 104,80 87,87 80,104 73,87 56,80 73,73" />
    <polygon points="80,56 97,63 104,80 97,97 80,104 63,97 56,80 63,63" />
    
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" />
    <polygon points="160,-24 167,-7 184,0 167,7 160,24 153,7 136,0 153,-7" />
    <polygon points="0,136 7,153 24,160 7,167 0,184 -7,167 -24,160 -7,153" />
    <polygon points="160,136 167,153 184,160 167,167 160,184 153,167 136,160 153,153" />

    <rect x="66" y="66" width="28" height="28" transform="rotate(45 80 80)" />

    <path d="M80,0 L100,20 L80,40 L60,20 Z" />
    <path d="M80,120 L100,140 L80,160 L60,140 Z" />
    <path d="M0,80 L20,60 L40,80 L20,100 Z" />
    <path d="M120,80 L140,60 L160,80 L140,100 Z" />

    <path d="M40,0 L40,40 L0,40" />
    <path d="M120,0 L120,40 L160,40" />
    <path d="M0,120 L40,120 L40,160" />
    <path d="M160,120 L120,120 L120,160" />
  </g>
</svg>
